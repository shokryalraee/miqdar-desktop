name: build
# Builds «مقدار كاشير» for Windows (NSIS .exe) and macOS (dmg + zip, x64 + arm64) and attaches them to the Release on a v* tag.
# Lives in the PUBLIC repo shokryalraee/miqdar-desktop. Unsigned unless the optional signing secrets below exist (then signing turns on by itself).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  # optional signing secrets (empty = unsigned build). Windows: WIN_CSC_LINK (.pfx base64 or URL) + WIN_CSC_KEY_PASSWORD.
  # macOS: MAC_CSC_LINK (.p12 base64) + MAC_CSC_KEY_PASSWORD (Developer ID Application) + APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (notarization).
  WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
  WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
  MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
  MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win }
          - { os: macos-latest, target: mac }
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dist' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - name: Select signing (only when secrets exist)
        shell: bash
        run: |
          export_env() { echo "$1=$2" >> "$GITHUB_ENV"; }
          if [ "${{ matrix.target }}" = "win" ]; then
            if [ -n "$WIN_CSC_LINK" ]; then export_env CSC_LINK "$WIN_CSC_LINK"; export_env CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"; echo "signing: windows ON"; else export_env CSC_IDENTITY_AUTO_DISCOVERY false; echo "signing: windows OFF (unsigned)"; fi
          else
            if [ -n "$MAC_CSC_LINK" ]; then export_env CSC_LINK "$MAC_CSC_LINK"; export_env CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"; echo "signing: mac ON"
              if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then export_env MAC_NOTARIZE true; echo "notarize: ON"; fi
            else export_env CSC_IDENTITY_AUTO_DISCOVERY false; echo "signing: mac OFF (unsigned)"; fi
          fi
      - name: Build
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          EXTRA=""; [ "${MAC_NOTARIZE:-}" = "true" ] && EXTRA="-c.mac.notarize=true"
          npm run "${PUBLISH}:${{ matrix.target }}" -- $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: miqdar-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
