name: build
# Builds the «مقدار كاشير» Windows installer (NSIS .exe). Unsigned for now (see README.md). Lives in the PUBLIC repo shokryalraee/miqdar-desktop.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - name: Build installer
        run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: miqdar-cashier-setup, path: 'dist/*.exe' }
      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
